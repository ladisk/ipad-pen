[project]
name = "ipad-pen"
version = "0.2.0"
description = "Use an iPad and Apple Pencil as a USB pen tablet on Linux"
authors = [
    { name = "Klemen Zaletelj", email = "zaletelj.klemen@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "evdev>=2.0.0",
    "pymobiledevice3>=11.65.0",
]

[project.scripts]
ipad-pen = "ipad_pen:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120
